
name: Verificacion del Sistema de Inventario

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Paso 1: Descargar el codigo
      - name: Descargar codigo
        uses: actions/checkout@v6

      # Paso 2: Configurar Python
      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # Paso 3: Mostrar la version de Python
      - name: Verificar version de Python
        run: python --version

      # Paso 4: Buscar archivos Python
      - name: Buscar archivos Python
        run: |
          echo "Buscando archivos Python..."
          find . -type f -name '*.py'

      # Paso 5: Verificar archivos Python
      - name: Validar archivos Python
        run: |
          test -n "$(find . -type f -name '*.py' -print -quit)" || {
            echo "ERROR: No hay archivos Python"
            exit 1
          }

      # Paso 6: Compilar archivos Python
      - name: Compilar archivos Python
        run: |
          echo "Verificando sintaxis del proyecto..."
          python -m compileall -q -f .

      # Paso 7: Ejecutar pruebas automatizadas
      - name: Ejecutar pruebas automatizadas
        run: |
          echo "Ejecutando pruebas del sistema..."
          python -m unittest discover -s tests -p "test_*.py" -v

      # Paso 8: Confirmar resultado
      - name: Confirmar construccion
        run: |
          echo "Construccion y pruebas completadas correctamente"
